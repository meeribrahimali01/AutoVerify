version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: autoverify-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - AUTOVERIFY_AI_API_KEY=${AUTOVERIFY_AI_API_KEY:-}
    volumes:
      - ./backend/temp_submissions:/app/temp_submissions

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: autoverify-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
